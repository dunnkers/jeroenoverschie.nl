name: Build Check

# Runs the full build (same steps as the deploy workflow) on every pull
# request against master, without deploying anything. Catches a broken
# build before it merges instead of after it's already live on Pages.

on:
  pull_request:
    branches:
      - master

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Checkout theme
      uses: actions/checkout@v7
      with:
        repository: dunnkers/ghost-dunnkers-theme-edition
        path: content/themes/dunnkers-theme-edition
        ref: master
        persist-credentials: false

    - name: Start Ghost Container
      run: |
        docker run -d --name ghost -p 2368:2368 \
          -v ${{ github.workspace }}/content:/var/lib/ghost/content \
          --env NODE_ENV=development \
          --env database__client=sqlite3 \
          --env database__connection__filename=/var/lib/ghost/content/data/ghost-local.db \
          --env url=http://localhost:2368 \
          ghost:6.62.0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install dependencies
      run: |
        npm install -g ghost-static-site-generator gh-pages replace-in-file
        npm install

    - name: Wait for Ghost to be ready
      run: |
        echo "Waiting for Ghost to start..."
        sleep 10
        # Use curl to check if Ghost is up and running
        until curl -s http://localhost:2368 > /dev/null; do
          echo "Ghost is unavailable - sleeping"
          sleep 5
        done
        echo "Ghost is up and running"

    - name: Build
      run: npm run build
